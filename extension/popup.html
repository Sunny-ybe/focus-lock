<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focus Lock</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <section id="setup-view" class="view">
        <h1>Focus Lock</h1>
        <label for="minutes">Minutes</label>
        <div class="input-row">
          <input id="minutes" type="number" min="1" max="1440" step="1" value="45" inputmode="numeric">
          <button id="start" type="button">Start</button>
        </div>

        <section class="site-panel" aria-labelledby="sites-title">
          <h2 id="sites-title">Blocked Sites</h2>
          <ul id="site-list" class="site-list"></ul>
          <div class="site-add-row">
            <input id="site-input" type="text" placeholder="youtube.com" autocomplete="off" spellcheck="false">
            <button id="add-site" type="button" aria-label="Add website">+</button>
          </div>
          <p id="site-error" class="error" role="alert"></p>
        </section>

        <p id="error" class="error" role="alert"></p>
      </section>

      <section id="locked-view" class="view hidden" aria-live="polite">
        <h1>Locked</h1>
        <div id="countdown" class="countdown">--:--</div>
        <p id="locked-summary" class="muted">Instagram and X/Twitter are blocked until the timer ends.</p>
        <p id="focus-note" class="warning hidden"></p>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
