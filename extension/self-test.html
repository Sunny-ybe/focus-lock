<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focus Lock Self-Test</title>
    <link rel="stylesheet" href="popup.css">
    <style>
      body {
        width: auto;
        min-height: 100vh;
      }

      .shell {
        max-width: 720px;
        margin: 0 auto;
        padding: 28px;
      }

      .test-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .test-list li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid #d6d0c5;
        border-radius: 8px;
        padding: 12px;
        background: #fffdf8;
      }

      .pass {
        color: #1b6f63;
        font-weight: 750;
      }

      .fail {
        color: #a12d2d;
        font-weight: 750;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="view">
        <h1>Focus Lock Self-Test</h1>
        <button id="run" type="button">Run</button>
        <ul id="results" class="test-list"></ul>
      </section>
    </main>

    <script src="self-test.js"></script>
  </body>
</html>
